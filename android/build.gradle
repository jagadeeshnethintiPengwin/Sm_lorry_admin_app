buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        /*
         * Reads `app/google-services.json` and generates the Firebase config
         * the SDK looks for at runtime. Without it the file is inert — it was
         * already checked in, which is why the app looked configured and no
         * token could ever be obtained.
         */
        classpath("com.google.gms:google-services:4.4.2")
    }
}

ext {
    /*
     * Point React Native's third-party Gradle modules (gesture-handler, screens,
     * svg) straight at the react-native package, so their build scripts never
     * shell out to `node` just to locate it — which fails when Android Studio is
     * launched from the Dock (its PATH omits the Homebrew/nvm node).
     */
    REACT_NATIVE_NODE_MODULES_DIR = new File(rootDir, "../node_modules/react-native").canonicalPath
}

apply plugin: "com.facebook.react.rootproject"
